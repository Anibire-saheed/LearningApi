spring.application.name=mosque-payment-service

spring.datasource.url=${DS_URL:jdbc:mysql://localhost:3306/mosquepayment?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Lagos}
spring.datasource.username=${DS_USERNAME:root}
spring.datasource.password=${DS_PASSWORD:pass}
spring.datasource.hikari.maximumPoolSize=${HIKARI_CONNECTION_MAX_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Lagos
spring.jpa.show-sql=false

server.port=8100

# Paystack (never commit a real key - set PAYSTACK_SECRET_KEY as an environment variable)
paystack.base-url=https://api.paystack.co
paystack.secret-key=${PAYSTACK_SECRET_KEY:sk_test_replace_me}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:3000/payment/callback}

# Admin login for /payments/admin/** (HTTP Basic)
mosque.admin.username=${ADMIN_USERNAME:admin}
mosque.admin.password=${ADMIN_PASSWORD:change-me}
